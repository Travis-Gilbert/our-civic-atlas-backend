[workspace]
members = [
    "crates/civic-atlas-cli",
    "crates/civic-atlas-outbox-worker",
    "crates/civic-atlas-reconstruction-engine",
    "crates/civic-atlas-server",
    "crates/civic-atlas-types",
    "crates/rustyred-client",
    "crates/tenant-resolver",
    "crates/theseus-client",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "json"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal"] }
tonic = "0.12"
tonic-build = "0.12"
tonic-web = "0.12"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
