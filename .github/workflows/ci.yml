name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "Travis-Gilbert/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/graphql-server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install uv
        run: python -m pip install uv
      - name: Install Node dependencies
        run: npm ci
        working-directory: apps/graphql-server
      - name: Check generated protos
        run: npm run proto:check
        working-directory: apps/graphql-server
      - name: Check proto shape
        run: npm run proto:shape
        working-directory: apps/graphql-server
      - name: Typecheck GraphQL sidecar
        run: npm run typecheck
        working-directory: apps/graphql-server
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --workspace
