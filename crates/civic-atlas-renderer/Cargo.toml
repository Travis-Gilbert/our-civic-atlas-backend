[package]
name = "civic-atlas-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Scene Foundry reconstruction renderer: turns a MergedReconstructionSpec into real, provenance-honest assets"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
civic-atlas-reconstruction-engine = { path = "../civic-atlas-reconstruction-engine" }
civic-atlas-types = { path = "../civic-atlas-types" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "import"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
