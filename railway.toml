[build]
# Use the repo's Dockerfile explicitly. Railpack auto-detection
# failed because the Cargo workspace ships 3 binaries and Railpack's
# default runtime image did not preserve target/release/. The
# Dockerfile is a 2-stage build that ends with the single
# civic-atlas-server binary on a slim Debian base.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Probe the Axum health route. The server binds HTTP to 0.0.0.0:$PORT
# (per main.rs PORT fallback), so Railway's healthchecker hits /healthz
# on the platform's allocated port automatically.
healthcheckPath = "/healthz"
healthcheckTimeout = 30

# On failure, retry rather than scale down to zero. Cargo workspace has
# heavy deps (tonic, sqlx); cold restarts incur build cost so failure
# tolerance matters during early iteration.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
