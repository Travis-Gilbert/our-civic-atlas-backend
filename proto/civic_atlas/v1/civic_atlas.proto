syntax = "proto3";

package civic_atlas.v1;

message TenantContext {
  string tenant_id = 1;
  string atlas_node_id = 2;
  map<string, string> metadata = 3;
}

message CivicObject {
  string id = 1;
  string tenant_id = 2;
  string name = 3;
  string object_type = 4;
  string geometry_json = 5;
  optional int64 time_start_ms = 6;
  optional int64 time_end_ms = 7;
  double confidence = 8;
  repeated string source_ids = 9;
  string dossier_path = 10;
  map<string, string> attributes = 11;
}

message GetPlaceRequest {
  TenantContext tenant_context = 1;
  string place_id = 2;
}

message GetPlaceResponse {
  CivicObject place = 1;
}

message ListPlacesRequest {
  TenantContext tenant_context = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListPlacesResponse {
  repeated CivicObject places = 1;
  string next_page_token = 2;
}

message GetNodeRequest {
  TenantContext tenant_context = 1;
  string node_id = 2;
}

message GetNodeResponse {
  CivicObject node = 1;
}

message GetDossierRequest {
  TenantContext tenant_context = 1;
  string object_id = 2;
}

message GetDossierResponse {
  string dossier_json = 1;
}

message ResolveTenantRequest {
  string slug = 1;
}

message ResolveTenantResponse {
  TenantContext tenant_context = 1;
  string display_name = 2;
}

message HealthRequest {
  TenantContext tenant_context = 1;
}

message HealthResponse {
  string status = 1;
  string service = 2;
  string tenant_id = 3;
}

// Civic research. Axum's outward face for the Node sidecar's
// `Mutation.civicResearch` resolver.
//
// Wire flow:
//   Node sidecar GraphQL resolver
//     -> CivicAtlasService.CivicResearch (this RPC, native gRPC)
//     -> theseus-client crate
//     -> TheseusBridge.Search (Index-API bridge_server.py)
//     -> Theseus compose engine (apps.notebook.ask_pipeline.ask_theseus)
//
// The compose engine reads from Theseus's own knowledge-graph store
// (PostgreSQL + FAISS). It is NOT the Theseus harness and does NOT
// touch RustyRedCore-THG; the harness is for Theseus-internal
// orchestration, THG is harness-bound. External consumers like Civic
// Atlas go through compose engine, which is Theseus's documented
// external retrieval contract.
//
// Why Axum owns this RPC instead of the sidecar calling Theseus
// directly: TenantContext enforcement, future caching against PostGIS
// or civic-atlas RustyRed (the project's own RustyRed deployment, not
// Theseus's THG), and the project rule "Service-Tier Auth Stays
// Server-Side". Theseus credentials live in this process, never in
// the sidecar or the browser.
message CivicResearchRequest {
  TenantContext tenant_context = 1;
  string query = 2;
  // Optional compose engine knobs (top_n, operating_point,
  // neural_tier, include_web). Forwarded verbatim as JSON; the
  // compose engine vocabulary evolves faster than this proto can
  // re-version.
  string budget_json = 3;
  // Optional scope hints (era, bbox, place_ids, source_ids,
  // min_confidence). Same JSON-serialization rationale.
  string scope_json = 4;
  // Optional session id for cross-call caching and follow-up.
  string session_id = 5;
  // Optional folio id when the call is part of a curated workspace.
  string folio_id = 6;
}

message CivicResearchResponse {
  // Compose engine trace identifier; useful for replay / compare.
  // Field name kept as `run_id` so the GraphQL contract (`runId`)
  // stays stable across implementation changes.
  string run_id = 1;
  // Compose engine method that ran (e.g. "compose_search").
  // Field name kept as `skill` so the GraphQL contract stays stable.
  string skill = 2;
  // Evidence the algorithm returned, serialized as JSON matching
  // the public `SearchResults` GraphQL type so the Node sidecar
  // can pass it through to the browser unchanged.
  string results_json = 3;
}

service CivicAtlasService {
  rpc GetPlace(GetPlaceRequest) returns (GetPlaceResponse);
  rpc ListPlaces(ListPlacesRequest) returns (ListPlacesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc GetDossier(GetDossierRequest) returns (GetDossierResponse);
  rpc ResolveTenant(ResolveTenantRequest) returns (ResolveTenantResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  // Civic research entrypoint. Fans out to Theseus's compose engine
  // via the theseus-client crate's gRPC connection (Search RPC). NOT
  // the harness path; NOT RustyRedCore-THG. Future iterations may
  // decorate the response with civic atlas data (per-place geometry
  // hydration from PostGIS, civic-atlas RustyRed hot-graph
  // augmentation) before returning to the sidecar.
  rpc CivicResearch(CivicResearchRequest) returns (CivicResearchResponse);
}

