syntax = "proto3";

package civic_atlas.v1;

import "civic_atlas/v1/civic_atlas.proto";

enum ReconstructionSpecStatus {
  RECONSTRUCTION_SPEC_STATUS_UNSPECIFIED = 0;
  RECONSTRUCTION_SPEC_STATUS_DRAFT = 1;
  RECONSTRUCTION_SPEC_STATUS_IN_REVIEW = 2;
  RECONSTRUCTION_SPEC_STATUS_APPROVED = 3;
  RECONSTRUCTION_SPEC_STATUS_SUPERSEDED = 4;
  RECONSTRUCTION_SPEC_STATUS_REJECTED = 5;
}

enum ReconstructionSourceType {
  RECONSTRUCTION_SOURCE_TYPE_UNSPECIFIED = 0;
  RECONSTRUCTION_SOURCE_TYPE_ARCHIVAL_PHOTO = 1;
  RECONSTRUCTION_SOURCE_TYPE_MAP = 2;
  RECONSTRUCTION_SOURCE_TYPE_PERMIT = 3;
  RECONSTRUCTION_SOURCE_TYPE_SURVEY = 4;
  RECONSTRUCTION_SOURCE_TYPE_ORAL_HISTORY = 5;
  RECONSTRUCTION_SOURCE_TYPE_MODEL_PRIOR = 6;
  RECONSTRUCTION_SOURCE_TYPE_OTHER = 7;
}

message ReconstructionSource {
  string source_id = 1;
  ReconstructionSourceType source_type = 2;
  string title = 3;
  string uri = 4;
  optional int64 captured_at_ms = 5;
  string citation = 6;
  map<string, string> metadata = 7;
}

message ProvenanceCorrection {
  string correction_id = 1;
  string correction_type = 2;
  string correction_reasoning = 3;
  optional int64 correction_approved_at_ms = 4;
}

message PartProvenance {
  repeated ReconstructionSource sources = 1;
  double part_confidence = 2;
  bool from_gnn_prior = 3;
  string moderator_notes = 4;
  // Phase 5 extension. 0-1 score indicating how authoritative the
  // source lanes are for this part (assessor records score high,
  // OSM-inferred low, footprint-only lowest). Used by Phase 6 training
  // to weight the loss per record. Defaults to 0 when unset, which
  // the training pass interprets as "no signal". Hand-authored specs
  // can leave this empty and let approval flow populate it from the
  // moderator's evidence rating.
  double coverage_quality = 5;
  // Phase 6 extension. Populated when `from_gnn_prior=true` to record
  // which model version produced the prior. Empty when the part is
  // not GNN-derived. Format: `<repo>/<short_sha>` or `v<semver>`
  // depending on the training artifact's manifest.
  string gnn_version = 6;
  repeated double per_source_confidences = 7;
  bool moderator_overridden = 8;
  optional int64 moderator_overridden_at_ms = 9;
  bool has_source_conflict = 10;
  ProvenanceCorrection correction = 11;
}

message DimensionRange {
  optional double min = 1;
  optional double max = 2;
  string unit = 3;
}

message TextureProvenance {
  string texture_source = 1;
  string lora_archetype = 2;
  optional double lora_weight = 3;
  string controlnet_conditioning_source = 4;
  optional double texture_confidence = 5;
}

message Mass {
  PartProvenance provenance = 1;
  string form = 2;
  uint32 stories = 3;
  DimensionRange height = 4;
  DimensionRange width = 5;
  DimensionRange depth = 6;
  map<string, string> attributes = 7;
  string part_id = 8;
  string footprint_geometry_id = 9;
}

message OpeningOverride {
  uint32 bay_index = 1;
  string override_kind = 2;
  string override_pattern = 3;
  PartProvenance override_provenance = 4;
}

message OpeningGrid {
  PartProvenance provenance = 1;
  uint32 bay_count = 2;
  uint32 floor_count = 3;
  string window_pattern = 4;
  reserved 5;
  map<string, string> attributes = 6;
  repeated OpeningOverride opening_overrides = 7;
  string part_id = 8;
  bool has_storefront_ground = 9;
}

message Facade {
  PartProvenance provenance = 1;
  string facade_side = 2;
  string primary_material = 3;
  string color = 4;
  repeated OpeningGrid opening_grids = 5;
  map<string, string> attributes = 6;
  string part_id = 7;
  TextureProvenance texture_provenance = 8;
}

message Roof {
  PartProvenance provenance = 1;
  string roof_type = 2;
  string roof_material = 3;
  optional double pitch_degrees = 4;
  map<string, string> attributes = 5;
  TextureProvenance texture_provenance = 6;
}

message Ornament {
  PartProvenance provenance = 1;
  string ornament_id = 2;
  string ornament_kind = 3;
  string location = 4;
  string ornament_material = 5;
  map<string, string> attributes = 6;
  string ornament_style = 7;
  TextureProvenance texture_provenance = 8;
}

message GroundFloor {
  PartProvenance provenance = 1;
  string use_type = 2;
  string storefront_type = 3;
  string entry_location = 4;
  bool has_canopy = 5;
  map<string, string> attributes = 6;
  string part_id = 7;
  TextureProvenance texture_provenance = 8;
}

message ReconstructionAsset {
  string asset_id = 1;
  string spec_id = 2;
  uint32 spec_version = 3;
  string tenant_id = 4;
  string asset_type = 5;
  string uri = 6;
  string content_hash = 7;
  map<string, string> metadata = 8;
}

message ReconstructionSpec {
  TenantContext tenant_context = 1;
  string spec_id = 2;
  string civic_object_id = 3;
  string building_id = 4;
  string parcel_id = 5;
  string block_id = 6;
  string title = 7;
  ReconstructionSpecStatus status = 8;
  uint32 spec_version = 9;
  string supersedes_spec_id = 10;
  optional int64 created_at_ms = 11;
  optional int64 updated_at_ms = 12;
  string created_by = 13;
  string reviewed_by = 14;
  Mass mass = 15;
  repeated Facade facades = 16;
  Roof roof = 17;
  repeated Ornament ornaments = 18;
  GroundFloor ground_floor = 19;
  repeated ReconstructionAsset assets = 20;
  map<string, string> metadata = 21;
  optional int64 t_start_ms = 22;
  optional int64 t_end_ms = 23;
  string archetype_classification = 24;
  string gnn_version = 25;
  optional int64 published_at_ms = 26;
  string license = 27;
}
