syntax = "proto3";

package theseus_bridge.v1;

import "civic_atlas/v1/civic_atlas.proto";

message SpacetimeTopicRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  string topic = 2;
  uint32 limit = 3;
}

message SpacetimeTopicChunk {
  string node_id = 1;
  string title = 2;
  string summary = 3;
  double score = 4;
  repeated float embedding = 5;
}

message SpacetimeEmbeddingRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  string node_id = 2;
}

message SpacetimeEmbeddingResponse {
  string node_id = 1;
  repeated float embedding = 2;
  string model = 3;
}

// Phase 6: batched lookup so the building head training and
// inference pipelines can hydrate a whole block subgraph in
// a single round trip instead of N. The frozen DyGFormer
// produces 256-d embeddings; this endpoint returns those
// vectors keyed by node_id.
message BatchSpacetimeEmbeddingRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  repeated string node_ids = 2;
}

message NodeEmbedding {
  repeated float embedding = 1;
  // True when the node had no embedding upstream and the server
  // returned a zero vector. The training and inference paths use
  // this flag to mask the slot rather than treat zeros as real.
  bool missing = 2;
}

message BatchSpacetimeEmbeddingResponse {
  // Keyed by node_id. Always present for every requested id,
  // with `missing=true` when upstream had no embedding.
  map<string, NodeEmbedding> embeddings = 1;
  string model = 2;
  // Version of the upstream Theseus model used. Phase 6 training
  // pins to a single model version per run.
  string model_version = 3;
}

message SearchObjectsRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  string query = 2;
  uint32 limit = 3;
}

message SearchObjectsResponse {
  repeated civic_atlas.v1.CivicObject objects = 1;
}

message IngestArtifactRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  string artifact_id = 2;
  string source_uri = 3;
  string payload_json = 4;
}

message IngestArtifactResponse {
  string artifact_id = 1;
  string status = 2;
}

message MorphologicalPlace {
  string place_id = 1;
  string geometry_geojson = 2;
  map<string, string> metadata = 3;
}

message MorphologicalMovement {
  string movement_id = 1;
  string geometry_geojson = 2;
  map<string, string> metadata = 3;
}

message MorphologicalGraphRequest {
  civic_atlas.v1.TenantContext tenant_context = 1;
  string model_run_id = 2;
  repeated MorphologicalPlace places = 3;
  repeated MorphologicalMovement movements = 4;
  map<string, string> parameters = 5;
}

message MorphologicalGraphEdge {
  string edge_id = 1;
  string source_id = 2;
  string source_kind = 3;
  string relation = 4;
  string target_id = 5;
  string target_kind = 6;
  double confidence = 7;
  string geometry_geojson = 8;
  map<string, string> properties = 9;
}

message MorphologicalGraphResponse {
  string model_run_id = 1;
  string status = 2;
  repeated MorphologicalGraphEdge edges = 3;
  string model = 4;
  string model_version = 5;
  repeated string warnings = 6;
}

// Civic research search has moved off this proto. The canonical
// contract is `theseus_search.v1.SearchService` (see
// `proto/theseus_search/v1/search.proto`, vendored from
// theorem-protos). The Axum civic-atlas-server's `CivicResearch`
// resolver now calls `theseus_search.v1.SearchService.Search` with
// `mode = SEARCH_MODE_CIVIC_ATLAS`.
//
// `theseus_bridge.v1` keeps its spacetime + embeddings + artifact
// RPCs below. Those are Theseus-bridge-specific concerns that are
// not part of the search orchestrator product.

service TheseusBridge {
  rpc ResolveSpacetimeTopic(SpacetimeTopicRequest) returns (stream SpacetimeTopicChunk);
  rpc GetSpacetimeEmbedding(SpacetimeEmbeddingRequest) returns (SpacetimeEmbeddingResponse);
  // Phase 6: batched version of GetSpacetimeEmbedding. Required
  // by building_head_train and building_head_infer so a block
  // subgraph of N nodes resolves in one call instead of N.
  rpc GetBatchSpacetimeEmbeddings(BatchSpacetimeEmbeddingRequest) returns (BatchSpacetimeEmbeddingResponse);
  rpc SearchObjects(SearchObjectsRequest) returns (SearchObjectsResponse);
  rpc IngestArtifact(IngestArtifactRequest) returns (IngestArtifactResponse);
  rpc BuildMorphologicalGraph(MorphologicalGraphRequest) returns (MorphologicalGraphResponse);
}
